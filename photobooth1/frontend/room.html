<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room — Photogether</title>
<link rel="stylesheet" href="css/style.css">
   <link rel="icon" type="image/png" href="photogetherlogo.png" />
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand">
    <span class="logo-placeholder" aria-hidden="true">PG</span>
    Photogether
  </a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">☰</button>
  <nav id="mainNav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<!-- LOBBY / CAPTURE VIEW -->
<div id="roomView">
  <div class="room-layout">
    <div>
      <div class="room-code-banner">
        Room code: <span id="roomCodeText">------</span>
        <span class="role-badge" id="roleBadge">Guest</span>
      </div>

      <div class="stage">
        <div class="countdown-overlay" id="countdownOverlay">
          <div class="countdown-number" id="countdownNumber">3</div>
        </div>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="video-grid" id="videoGrid">
          <div class="video-tile local">
            <video id="localVideo" autoplay playsinline muted></video>
            <span class="tag">You</span>
          </div>
        </div>
      </div>

      <p class="status-line" id="statusLine">Connecting…</p>
    </div>

    <div class="side-panel card">
      <div>
        <label class="field-label">Number of shots</label>
        <div class="shot-selector" id="shotSelector">
          <!-- buttons injected by JS -->
        </div>
      </div>

      <div class="mic-row">
        <button class="btn-icon" id="micBtn" title="Enable microphone">🎙️</button>
        <span id="micStatus">Tap to enable mic</span>
      </div>

      <button class="btn btn-primary" id="startBtn" style="width:100%;">Start</button>
      <p style="font-size:0.8rem; color:var(--ink-soft); margin:0;" id="hostHint"></p>
      <button class="btn btn-ghost" id="leaveBtn" style="width:100%;">Leave Room</button>
    </div>
  </div>
</div>

<!-- RESULTS VIEW -->
<div id="resultsView" style="display:none;">
  <div class="results-wrap">
    <div>
      <div class="filmstrip" id="filmstrip">
        <img id="previewImg" alt="Your photo strip preview">
      </div>
      <div class="button-row" style="margin-top:20px;">
        <button class="btn btn-primary" id="downloadBtn">Save &amp; Download</button>
        <button class="btn btn-ghost" id="retakeBtn">Retake</button>
      </div>
      <p class="status-line" id="resultsStatus"></p>
    </div>

    <div class="card border-panel">
      <h3 style="font-size:1.1rem;">Choose a border</h3>
      <p style="font-size:0.85rem; margin-top:-6px;">Tap a shot on the left to move, draw, add stickers/text, or retake it.</p>
      <div class="border-options" id="borderOptions"></div>
    </div>
  </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>
<canvas id="stripCanvas" style="display:none;"></canvas>

<!-- Photo editor modal -->
<div class="editor-overlay" id="editorOverlay">
  <div class="editor-modal">
    <div class="editor-toolbar" id="editorToolbar">
      <button class="tool-btn selected" data-tool="move">✋ Move</button>
      <button class="tool-btn" data-tool="draw">✏️ Draw</button>
      <button class="tool-btn" data-tool="erase">🧽 Erase</button>
      <button class="tool-btn" data-tool="text">🔤 Text</button>
      <button class="tool-btn" data-tool="sticker">✨ Sticker</button>
    </div>

    <div class="sticker-row" id="stickerRow" style="display:none;"></div>

    <div class="editor-controls-row">
      <label>Color <input type="color" id="editorColor" value="#a5502e"></label>
      <label>Size <input type="range" id="editorSize" min="2" max="40" value="6"></label>
    </div>

    <div class="editor-canvas-wrap">
      <canvas id="editorCanvas"></canvas>
    </div>

    <div class="editor-footer">
      <button class="btn btn-ghost" id="editorRetakeBtn">Retake shot</button>
      <div class="button-row">
        <button class="btn btn-ghost" id="editorCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="editorSaveBtn">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cleanup.js"></script>
<script src="js/webrtc.js"></script>
<script src="js/editor.js"></script>
<script src="js/room.js"></script>
<script src="js/nav.js"></script>

</body>
</html>
