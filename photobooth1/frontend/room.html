<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room — LDR Photobooth</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="brand">📸 Together Booth</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<!-- LOBBY / CAPTURE VIEW -->
<div id="roomView">
  <div class="room-layout">
    <div>
      <div class="room-code-banner">Room code: <span id="roomCodeText">------</span></div>

      <div class="stage">
        <div class="countdown-overlay" id="countdownOverlay">
          <div class="countdown-number" id="countdownNumber">3</div>
        </div>
        <div class="flash-overlay" id="flashOverlay"></div>
        <div class="video-grid" id="videoGrid">
          <div class="video-tile local">
            <video id="localVideo" autoplay playsinline muted></video>
            <span class="tag">You</span>
          </div>
        </div>
      </div>

      <p class="status-line" id="statusLine">Connecting…</p>
    </div>

    <div class="side-panel card">
      <div>
        <label class="field-label">Number of shots</label>
        <div class="shot-selector" id="shotSelector">
          <!-- buttons injected by JS -->
        </div>
      </div>

      <div class="mic-row">
        <button class="btn-icon active" id="micBtn" title="Toggle microphone">🎤</button>
        <span id="micStatus">Mic on</span>
      </div>

      <button class="btn btn-primary" id="startBtn" style="width:100%;">Start</button>
      <p style="font-size:0.8rem; color:var(--ink-soft); margin:0;" id="hostHint"></p>
      <button class="btn btn-ghost" id="leaveBtn" style="width:100%;">Leave Room</button>
    </div>
  </div>
</div>

<!-- RESULTS VIEW -->
<div id="resultsView" style="display:none;">
  <div class="results-wrap">
    <div>
      <div class="filmstrip" id="filmstrip"></div>
      <div class="button-row" style="margin-top:20px;">
        <button class="btn btn-primary" id="downloadBtn">Save &amp; Download</button>
        <button class="btn btn-ghost" id="retakeBtn">Retake</button>
      </div>
      <p class="status-line" id="resultsStatus"></p>
    </div>

    <div class="card border-panel">
      <h3 style="font-size:1.1rem;">Choose a border</h3>
      <div class="border-options" id="borderOptions"></div>
      <label class="field-label" for="customBorderInput">Or upload your own</label>
      <input type="file" id="customBorderInput" accept="image/png">
    </div>
  </div>
</div>

<canvas id="captureCanvas" style="display:none;"></canvas>
<canvas id="stripCanvas" style="display:none;"></canvas>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cleanup.js"></script>
<script src="js/webrtc.js"></script>
<script src="js/room.js"></script>

</body>
</html>
